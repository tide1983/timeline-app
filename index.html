<!doctype html><html lang=ru><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Timeline</title><script defer src=bundle.js></script></head><body><div class=app><div class=timeline id=timeline></div><div class=input-area id=input-area><input id=text-input placeholder="Введите текст и нажмите Enter..." autocomplete=off><div class=controls><button id=mic-btn title="Записать аудио" type=button></button> <button id=cam-btn title="Записать видео" type=button></button></div></div><div class="recording-area hidden" id=recording-area><video id=video-preview class="video-preview hidden" muted playsinline></video><div class=recording-controls><span id=timer class=timer>00:00</span> <button id=rec-ok title=Сохранить type=button></button> <button id=rec-cancel title=Отменить type=button></button></div></div></div><div class="modal-overlay hidden" id=modal><div class=modal><h3>Что-то пошло не так</h3><p>К сожалению, нам не удалось определить ваше местоположение. Пожалуйста, дайте разрешение на использование геолокации либо введите координаты вручную.</p><label for=manual-coords>Широта и долгота через запятую</label> <input id=manual-coords placeholder="51.50851, -0.12572" autocomplete=off><div class=modal-buttons><button id=cancel-modal type=button>Отмена</button> <button id=ok-modal type=button>ОК</button></div></div></div></body></html>
