<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeline</title>
</head>
<body>
    <div class="app">
        <!-- Лента постов -->
        <div class="timeline" id="timeline"></div>

        <!-- Поле ввода -->
        <div class="input-area" id="input-area">
            <input
                type="text"
                id="text-input"
                placeholder="Введите текст и нажмите Enter..."
                autocomplete="off"
            >
            <div class="controls">
                <button id="mic-btn" title="Записать аудио" type="button"></button>
                <button id="cam-btn" title="Записать видео" type="button"></button>
            </div>
        </div>

        <!-- Блок записи -->
        <div class="recording-area hidden" id="recording-area">
            <video id="video-preview" class="video-preview hidden" muted playsinline></video>
            <div class="recording-controls">
                <span id="timer" class="timer">00:00</span>
                <button id="rec-ok" title="Сохранить" type="button"></button>
                <button id="rec-cancel" title="Отменить" type="button"></button>
            </div>
        </div>
    </div>

    <!-- Модалка для ручного ввода координат -->
    <div class="modal-overlay hidden" id="modal">
        <div class="modal">
            <h3>Что-то пошло не так</h3>
            <p>К сожалению, нам не удалось определить ваше местоположение.
               Пожалуйста, дайте разрешение на использование геолокации
               либо введите координаты вручную.</p>
            <label for="manual-coords">Широта и долгота через запятую</label>
            <input
                type="text"
                id="manual-coords"
                placeholder="51.50851, -0.12572"
                autocomplete="off"
            >
            <div class="modal-buttons">
                <button id="cancel-modal" type="button">Отмена</button>
                <button id="ok-modal" type="button">ОК</button>
            </div>
        </div>
    </div>
</body>
</html>
